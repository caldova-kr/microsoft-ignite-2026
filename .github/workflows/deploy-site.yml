name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
  # Issue proposals/claims are shown in the site catalog, so republish when they change.
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled, deleted]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate notes against the Ignite catalog
        run: python tools/validate.py
      - name: Generated files are up to date
        run: python tools/build_pages.py --check
      - run: python -m pytest -q
      - name: Site agent tests
        run: node --test "tests/*.test.mjs"
      - name: Session issues → site catalog (not committed)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/fetch_issues.py --repo "${{ github.repository }}"
      - name: Agent login relay URL → agent.json (not committed)
        if: github.event_name != 'pull_request'
        env:
          AGENT_RELAY_URL: ${{ vars.AGENT_RELAY_URL }}
        run: |
          python - <<'PY'
          import json, os
          with open("docs/agent.json", "w") as f:
              json.dump({"relay": os.environ.get("AGENT_RELAY_URL", "")}, f)
          PY
      - run: mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
