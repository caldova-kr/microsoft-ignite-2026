site_name: Microsoft Ignite 2026 — Session Notes
site_description: Microsoft Ignite 2026 세션을 세션 원문 근거로 정리한 고객·아키텍트 관점 노트
site_url: https://caldova-kr.github.io/microsoft-ignite-2026/
repo_url: https://github.com/caldova-kr/microsoft-ignite-2026
repo_name: caldova-kr/microsoft-ignite-2026
edit_uri: edit/main/docs/
copyright: Unofficial community notes · not affiliated with Microsoft

docs_dir: docs
site_dir: _site

# Keep the build Zensical-compatible: no hooks, no third-party plugins.
# Generated pages come from `python tools/build_pages.py` (checked in CI).
exclude_docs: |
  sessions/_TEMPLATE.md
  themes/_TEMPLATE.md

validation:
  links:
    anchors: warn

theme:
  name: material
  language: ko
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 어두운 테마로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 밝은 테마로 전환

plugins:
  - search:
      lang:
        - ko
        - en

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:        # docs/contributing.md includes the root CONTRIBUTING.md
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/catalog.js
  - javascripts/site.js

# gen:nav — generated by tools/build_pages.py (keynotes, then sessions by first catalog topic)
nav:
  - 홈: index.md
  - 세션 카탈로그: catalog/index.md
  - 세션 노트:
      - sessions/index.md
      - "Keynote":
          - "KEY01 — Microsoft Ignite opening keynote": sessions/KEY01-microsoft-ignite-opening-keynote.md
  - 테마:
      - themes/index.md
  - 기여하기: contributing.md
# /gen:nav
