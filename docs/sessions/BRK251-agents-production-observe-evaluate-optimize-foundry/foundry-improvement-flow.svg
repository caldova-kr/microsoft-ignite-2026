  <path d="M 300,460 V 524 Q 300,532 292,532 H 32 Q 24,532 24,524 V 66 Q 24,58 32,58 H 54" fill="none" stroke="#1759c0" stroke-width="2" marker-end="url(#brk251-arrow-accent)"/>
  <rect x="60" y="508" width="176" height="16" rx="3" fill="#ffffff"/>
  <text x="148" y="520" fill="#1759c0" font-size="11.5" font-weight="700" text-anchor="middle">새 버전 승격 · 사람이 결정</text>

