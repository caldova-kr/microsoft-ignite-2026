  <rect x="584" y="244" width="168" height="64" rx="8" fill="#ffffff" stroke="#c9d3df" stroke-width="1.2"/>
  <rect x="594" y="252" width="56" height="16" rx="3" fill="#ffffff" stroke="#8a94a6"/>
  <text x="622" y="264" fill="#566578" font-size="9.5" font-weight="700" text-anchor="middle">PREVIEW</text>
  <text x="594" y="286" fill="#182230" font-size="14" font-weight="700">Annotations</text>
  <text x="594" y="302" fill="#566578" font-size="11">전문가 피드백</text>

  <rect x="400" y="388" width="352" height="72" rx="8" fill="#eaf1fb" stroke="#1759c0" stroke-width="1.8"/>
  <rect x="410" y="396" width="56" height="16" rx="3" fill="#ffffff" stroke="#8a94a6"/>
  <text x="438" y="408" fill="#566578" font-size="9.5" font-weight="700" text-anchor="middle">PREVIEW</text>
  <text x="410" y="432" fill="#182230" font-size="14" font-weight="700">Agent Optimizer</text>
  <text x="410" y="450" fill="#566578" font-size="11">insight 수정 · skill 학습 · 비용 최적화 → 후보</text>

