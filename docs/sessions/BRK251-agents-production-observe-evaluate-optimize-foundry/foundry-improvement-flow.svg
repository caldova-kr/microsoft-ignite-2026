<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 604" role="img" aria-labelledby="brk251-flow-title brk251-flow-desc" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <title id="brk251-flow-title">Foundry 에이전트 관측 · 개선 흐름</title>
  <desc id="brk251-flow-desc">에이전트가 남긴 trace 를 Build 단계의 평가, Production 단계의 Insights · Annotations · Agent Optimizer, Scale 단계의 Fleet overview 가 함께 읽고, Optimizer 가 만든 후보를 Evaluation 이 채점하고, 그 결과를 보고 사람이 승격하면 새 에이전트 버전으로 돌아가는 루프.</desc>
  <defs>
    <marker id="brk251-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#566578"/>
    </marker>
    <marker id="brk251-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1759c0"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="603" rx="12" fill="#ffffff" stroke="#dbe2eb"/>

  <!-- zones -->
  <rect x="40" y="204" width="328" height="296" rx="10" fill="#eef2f7" stroke="#dbe2eb"/>
  <text x="56" y="488" fill="#566578" font-size="12" font-weight="700" letter-spacing="0.06em">① BUILD · 기준 세우기</text>
  <rect x="384" y="204" width="384" height="296" rx="10" fill="#eef2f7" stroke="#dbe2eb"/>
  <text x="400" y="488" fill="#566578" font-size="12" font-weight="700" letter-spacing="0.06em">② PRODUCTION · 찾고 고치기</text>
  <rect x="784" y="204" width="176" height="296" rx="10" fill="#eef2f7" stroke="#dbe2eb"/>
  <text x="800" y="488" fill="#566578" font-size="12" font-weight="700" letter-spacing="0.06em">③ SCALE · 전체 보기</text>

  <!-- connectors (drawn before boxes) -->
  <line x1="148" y1="88" x2="148" y2="122" stroke="#566578" stroke-width="1.4" marker-end="url(#brk251-arrow)"/>
  <line x1="204" y1="168" x2="204" y2="386" stroke="#566578" stroke-width="1.4" marker-end="url(#brk251-arrow)"/>
  <line x1="116" y1="308" x2="116" y2="386" stroke="#566578" stroke-width="1.4" marker-end="url(#brk251-arrow)"/>
  <line x1="292" y1="308" x2="292" y2="386" stroke="#566578" stroke-width="1.4" marker-end="url(#brk251-arrow)"/>
  <line x1="484" y1="168" x2="484" y2="242" stroke="#566578" stroke-width="1.4" marker-end="url(#brk251-arrow)"/>
  <line x1="668" y1="168" x2="668" y2="242" stroke="#566578" stroke-width="1.4" marker-end="url(#brk251-arrow)"/>
  <line x1="872" y1="168" x2="872" y2="242" stroke="#566578" stroke-width="1.4" marker-end="url(#brk251-arrow)"/>
  <line x1="484" y1="308" x2="484" y2="386" stroke="#566578" stroke-width="1.4" marker-end="url(#brk251-arrow)"/>
  <line x1="668" y1="308" x2="668" y2="386" stroke="#566578" stroke-width="1.4" marker-end="url(#brk251-arrow)"/>
  <line x1="398" y1="424" x2="354" y2="424" stroke="#566578" stroke-width="1.4" marker-end="url(#brk251-arrow)"/>
