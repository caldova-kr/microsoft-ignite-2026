  <text x="504" y="585" fill="#566578" font-size="11">trace · 평가 데이터 흐름</text>
  <line x1="660" y1="581" x2="696" y2="581" stroke="#1759c0" stroke-width="2" marker-end="url(#brk251-arrow-accent)"/>
  <text x="704" y="585" fill="#566578" font-size="11">개선 루프</text>
