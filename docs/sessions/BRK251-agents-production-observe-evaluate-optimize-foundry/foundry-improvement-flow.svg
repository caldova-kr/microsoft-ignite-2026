  <rect x="800" y="244" width="144" height="88" rx="8" fill="#ffffff" stroke="#c9d3df" stroke-width="1.2"/>
  <rect x="810" y="252" width="56" height="16" rx="3" fill="#ffffff" stroke="#8a94a6"/>
  <text x="838" y="264" fill="#566578" font-size="9.5" font-weight="700" text-anchor="middle">PREVIEW</text>
  <text x="810" y="286" fill="#182230" font-size="14" font-weight="700">Fleet overview</text>
  <text x="810" y="304" fill="#566578" font-size="11">health · quality</text>
  <text x="810" y="320" fill="#566578" font-size="11">cost · 예산</text>

  <!-- legend -->
  <line x1="40" y1="556" x2="960" y2="556" stroke="#dbe2eb" stroke-width="1"/>
  <text x="40" y="584" fill="#566578" font-size="10" font-weight="700" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="573" width="40" height="16" rx="3" fill="#e6f4ea" stroke="#2e7d32"/>
  <text x="140" y="585" fill="#2e7d32" font-size="9.5" font-weight="700" text-anchor="middle">GA</text>
  <text x="168" y="585" fill="#566578" font-size="11">이번에 정식 출시</text>
  <rect x="280" y="573" width="56" height="16" rx="3" fill="#ffffff" stroke="#8a94a6"/>
  <text x="308" y="585" fill="#566578" font-size="9.5" font-weight="700" text-anchor="middle">PREVIEW</text>
